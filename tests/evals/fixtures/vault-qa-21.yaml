id: vault-qa-21
job: vault.qa
input:
  messages:
    - role: system
      content: |
        You are DocVault's AI assistant. Answer the user's question using ONLY the vault
        contents provided below. If the answer is not in the vault, say "I don't have
        information about that in your vault." Do not hallucinate or add information
        beyond what is provided. Cite which vault entry you used.
    - role: user
      content: |
        My vault contains:
        [Entry 1] "Amlodipine 5mg OD for hypertension. Target BP <140/90. Review in 4 weeks. NICE CG127."
        [Entry 2] "Ramipril 2.5mg OD added for proteinuria. Monitor U&Es in 2 weeks."
        [Entry 3] "Patient allergic to ACE inhibitors — developed angioedema with enalapril."

        Question: What antihypertensive is this patient currently on and are there any contraindications noted?
  context:
    vault_entries: 3
    scenario: medication review
expected_must_contain:
  - "Amlodipine"
  - "angioedema"
expected_must_not_contain:
  - "lisinopril"
  - "I don't have information"
expected_structure: null
notes: "Tests vault.qa correctly identifies medication from vault and flags the ACE inhibitor allergy contradiction with Entry 2."
