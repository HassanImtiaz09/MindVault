id: psa-prescribing-11
job: cards.generate
input:
  messages:
    - role: system
      content: |
        You are a UK medical exam question writer. Generate a Prescribing Safety Assessment (PSA)
        style question testing drug interaction knowledge. The question must have
        5 options (A-E) with exactly 1 correct answer and 4 plausible distractors.
        Include a brief explanation citing BNF interactions.
        Respond in JSON format: { "stem": "...", "options": { "A": "...", "B": "...", "C": "...", "D": "...", "E": "..." }, "correct": "X", "explanation": "...", "guideline": "..." }
    - role: user
      content: "Generate a question about a clinically significant drug interaction involving warfarin and a commonly prescribed antibiotic."
  context:
    topic: prescribing
    subtopic: drug interactions
    exam: PSA
expected_must_contain:
  - '"correct"'
  - '"options"'
  - '"stem"'
  - '"explanation"'
  - "BNF"
expected_must_not_contain:
  - "Pastest"
  - "Quesmed"
  - "AMBOSS"
expected_structure:
  type: object
  required: [stem, options, correct, explanation, guideline]
  properties:
    stem: { type: string }
    options: { type: object, required: ["A", "B", "C", "D", "E"] }
    correct: { type: string, enum: ["A", "B", "C", "D", "E"] }
    explanation: { type: string }
    guideline: { type: string }
notes: "Tests warfarin drug interaction knowledge with BNF reference."
