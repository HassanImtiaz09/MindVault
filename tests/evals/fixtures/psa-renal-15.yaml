id: psa-renal-15
job: cards.generate
input:
  messages:
    - role: system
      content: |
        You are a UK medical exam question writer. Generate a Prescribing Safety Assessment (PSA)
        style question testing prescribing in renal impairment. The question must have
        5 options (A-E) with exactly 1 correct answer and 4 plausible distractors.
        Include a brief explanation citing BNF renal appendix guidance.
        Respond in JSON format: { "stem": "...", "options": { "A": "...", "B": "...", "C": "...", "D": "...", "E": "..." }, "correct": "X", "explanation": "...", "guideline": "..." }
    - role: user
      content: "Generate a question about dose adjustment of a commonly prescribed drug (e.g., metformin or an NSAID) in a patient with CKD stage 4 (eGFR 20 mL/min)."
  context:
    topic: prescribing
    subtopic: renal impairment
    exam: PSA
expected_must_contain:
  - '"correct"'
  - '"options"'
  - '"stem"'
  - '"explanation"'
  - '"guideline"'
expected_must_not_contain:
  - "Pastest"
  - "Quesmed"
  - "AMBOSS"
expected_structure:
  type: object
  required: [stem, options, correct, explanation, guideline]
  properties:
    stem: { type: string }
    options: { type: object, required: ["A", "B", "C", "D", "E"] }
    correct: { type: string, enum: ["A", "B", "C", "D", "E"] }
    explanation: { type: string }
    guideline: { type: string }
notes: "Tests prescribing in renal impairment with BNF renal appendix reference."
