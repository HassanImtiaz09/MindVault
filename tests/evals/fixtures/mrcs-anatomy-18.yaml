id: mrcs-anatomy-18
job: cards.generate
input:
  messages:
    - role: system
      content: |
        You are a UK medical exam question writer. Generate a MRCS Part A style SBA question
        on applied surgical anatomy. The question must have 5 options (A-E) with exactly
        1 correct answer and 4 plausible distractors. Include anatomical reasoning in the explanation.
        Respond in JSON format: { "stem": "...", "options": { "A": "...", "B": "...", "C": "...", "D": "...", "E": "..." }, "correct": "X", "explanation": "...", "guideline": "..." }
    - role: user
      content: "Generate a question about the blood supply to the stomach and which vessel is ligated during a specific gastrectomy procedure."
  context:
    topic: anatomy
    subtopic: upper GI
    exam: MRCS
expected_must_contain:
  - '"correct"'
  - '"options"'
  - '"stem"'
  - '"explanation"'
expected_must_not_contain:
  - "Pastest"
  - "Quesmed"
  - "AMBOSS"
expected_structure:
  type: object
  required: [stem, options, correct, explanation, guideline]
  properties:
    stem: { type: string }
    options: { type: object, required: ["A", "B", "C", "D", "E"] }
    correct: { type: string, enum: ["A", "B", "C", "D", "E"] }
    explanation: { type: string }
    guideline: { type: string }
notes: "Tests gastric blood supply anatomy relevant to gastrectomy."
